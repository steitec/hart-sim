[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hart-sim"
version = "0.1.0"
description = "Simulated HART field devices (pressure and temperature transmitters) speaking HART-IP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ralf Steinert"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["hart", "hart-ip", "simulator", "process automation", "field device", "test automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/steitec/hart-sim"
Repository = "https://github.com/steitec/hart-sim"
Changelog = "https://github.com/steitec/hart-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/steitec/hart-sim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
hart-sim = "hart_sim.cli:main"

[project.entry-points.pytest11]
hart_sim = "hart_sim.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["tshark: needs tshark installed (run with -m tshark)"]
addopts = "-m 'not tshark'"

[tool.setuptools.package-data]
hart_sim = ["profiles/*.yaml"]
