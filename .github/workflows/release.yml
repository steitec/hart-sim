name: Release

# Publishes to PyPI and ghcr.io when a version tag (v1.2.3) is pushed: runs the tests,
# checks that the tag matches the package version, builds, then publishes.
# Needs a Trusted Publisher on PyPI for this repository and workflow
# (environment "pypi"); no API token is stored in the repository.

on:
  push:
    tags: ["v*"]

# Jobs that need more (publishing) ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - run: pytest -v examples/test_example.py

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import ast, pathlib; \
            tree = ast.parse(pathlib.Path('src/hart_sim/__init__.py').read_text()); \
            print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag ${GITHUB_REF_NAME}, __version__ ${version}, pyproject ${project}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${version}" = "${project}"
      - run: pip install "build>=1.2" "twine>=6"
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    needs: [test, build, publish]  # only an image for a version that is on PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version from the tag; "latest" only for final releases (no rc/a/b/dev)
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then prerelease=false; else prerelease=true; fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/steitec/hart-sim:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'ghcr.io/steitec/hart-sim:latest' || '' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
