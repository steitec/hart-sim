name: Service container

# Runs the published image the way the wiki (Testing-in-CI) shows it: as a service
# container in GitHub Actions, once for a job on the runner and once for a job in a
# container. Starts after every successful release, or by hand for any version.
# It tests what is on ghcr.io, not the code of a pull request; ci.yml does that.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 0.1.1 or latest"
        default: latest

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pip: ${{ steps.version.outputs.pip }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
          RELEASED: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_run ]; then tag="${RELEASED#v}"; else tag="${INPUT}"; fi
          [[ "${tag}" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+.*)$ ]] || { echo "bad version ${tag}"; exit 1; }
          if [ "${tag}" = latest ]; then pip=hart-sim; else pip="hart-sim==${tag}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pip=${pip}" >> "$GITHUB_OUTPUT"

  on-runner:
    needs: version
    runs-on: ubuntu-latest
    services:
      hart:
        image: ghcr.io/steitec/hart-sim:${{ needs.version.outputs.tag }}
        ports:
          - 5094:5094
          - 5094:5094/udp
          - 127.0.0.1:5095:5095
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the released package (PyPI's index can lag a few minutes behind a release)
        run: |
          for _ in $(seq 10); do
            pip install --no-cache-dir "${{ needs.version.outputs.pip }}" && exit 0; sleep 30
          done
          exit 1
      - name: Ready without waiting, on TCP and UDP
        run: |
          hart-sim poll | grep PT-101
          hart-sim poll --udp | grep TT-201
      - name: Faults over the control channel on the host's loopback
        run: |
          hart-sim inject PT-101 sensor_failure
          hart-sim cmd --tag PT-101 1 | grep 'device malfunction'
          hart-sim clear PT-101
          ! hart-sim cmd --tag PT-101 1 | grep 'device malfunction'

  in-container:
    needs: version
    runs-on: ubuntu-latest
    container: python:3.13-slim
    services:
      hart:
        image: ghcr.io/steitec/hart-sim:${{ needs.version.outputs.tag }}
    steps:
      - name: Install the released package (PyPI's index can lag a few minutes behind a release)
        run: |
          for _ in $(seq 10); do
            pip install --no-cache-dir "${{ needs.version.outputs.pip }}" && exit 0; sleep 30
          done
          exit 1
      - name: Ready without waiting, under the service name
        run: hart-sim poll --host hart | grep PT-101
      - name: Faults over the control channel of the service
        run: |
          hart-sim inject PT-101 sensor_failure --host hart
          hart-sim cmd --tag PT-101 1 --host hart | grep 'device malfunction'
          hart-sim clear PT-101 --host hart
